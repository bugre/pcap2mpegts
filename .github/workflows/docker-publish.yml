name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  # DOCKERHUB_USERNAME	GitHub → Settings → Secrets and variables → Actions	Your Docker Hub username (e.g. bugre)
  # DOCKERHUB_TOKEN	Same	Docker Hub access token (https://hub.docker.com/settings/security)
  # Future: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets, then uncomment below
  # REGISTRY_DOCKERHUB: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION=$(awk -F 'version="|"' '/LABEL version="/{print $2}' Dockerfile | head -1)
          echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR (pcap2mpegts + pcap2ts)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/pcap2mpegts:latest
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/pcap2mpegts:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/pcap2ts:latest
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/pcap2ts:${{ steps.version.outputs.version }}

      # Future: push to Docker Hub (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
